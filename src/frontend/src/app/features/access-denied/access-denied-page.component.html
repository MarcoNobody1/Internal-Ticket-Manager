<p-card class="access-denied-page itm-surface-card">
  <ng-template pTemplate="content">
    <div class="access-denied-page__icon">
      <i class="pi pi-shield"></i>
    </div>

    <p class="itm-page-eyebrow">Access denied</p>
    <h1 class="itm-page-title">This account cannot open that area.</h1>
    <p class="access-denied-page__copy">
      The route you tried to open needs permissions that this signed-in user does not have.
      <ng-container *ngIf="blockedRoute">Requested route: <strong>{{ blockedRoute }}</strong>.</ng-container>
    </p>

    <div class="access-denied-page__actions">
      <a pButton routerLink="/workspace" icon="pi pi-home" label="Back to workspace"></a>
      <a pButton text routerLink="/workspace/account" icon="pi pi-user" label="Review account"></a>
    </div>
  </ng-template>
</p-card>
