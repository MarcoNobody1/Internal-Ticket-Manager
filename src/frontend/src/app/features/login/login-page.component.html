<section class="login-page">
  <mat-card class="login-page__card">
    <p class="login-page__eyebrow">Frontend Auth Slice</p>
    <h1>Sign in</h1>
    <p class="login-page__intro">
      This demo uses the existing backend JWT endpoint and keeps auth state in session storage for a modest, interview-defendable flow.
    </p>

    <form [formGroup]="loginForm" (ngSubmit)="submit()" class="login-page__form">
      <mat-form-field appearance="outline">
        <mat-label>Username</mat-label>
        <input matInput formControlName="username" autocomplete="username" />
        <mat-error *ngIf="loginForm.controls.username.hasError('required')">
          Username is required.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="current-password" />
        <mat-error *ngIf="loginForm.controls.password.hasError('required')">
          Password is required.
        </mat-error>
      </mat-form-field>

      <button mat-flat-button color="primary" type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>

    <div class="login-page__hint">
      <strong>Demo users</strong>
      <span>admin.demo / AdminDemo123!</span>
      <span>developer.demo / DeveloperDemo123!</span>
    </div>
  </mat-card>
</section>
